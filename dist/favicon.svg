<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#grad1)"/>
  
  <!-- RCS Text -->
  <text x="50" y="65" font-family="Arial Black, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">RCS</text>
  
  <!-- Small accent line -->
  <line x1="20" y1="75" x2="80" y2="75" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
</svg>
